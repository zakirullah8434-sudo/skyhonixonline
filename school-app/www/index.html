<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4F46E5">
  <title>SkyHonix School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Splash ---------- */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(155deg, #4F46E5 0%, #6D28D9 52%, #7C3AED 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
      padding: 24px;
      text-align: center;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-mark {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      margin-bottom: 18px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.28);
      backdrop-filter: blur(6px);
    }
    #splash h1 { color: #fff; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    #splash p { color: rgba(255, 255, 255, 0.72); font-size: 0.86rem; margin-bottom: 26px; letter-spacing: 0.04em; }
    #splash .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Screens ---------- */
    .screen {
      display: none;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(155deg, #4F46E5 0%, #6D28D9 52%, #7C3AED 100%);
      align-items: center;
      justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      position: relative;
      overflow-x: hidden;
    }
    .screen::before,
    .screen::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 0;
    }
    .screen::before { width: 260px; height: 260px; top: -90px; left: -80px; }
    .screen::after { width: 220px; height: 220px; bottom: -70px; right: -70px; }

    .card {
      position: relative;
      z-index: 1;
      background: #fff;
      border-radius: 22px;
      padding: 28px 22px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 26px 60px rgba(15, 23, 42, 0.3);
    }

    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .brand-mark {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 10px 22px -8px rgba(79, 70, 229, 0.75);
    }
    .brand-text { min-width: 0; }
    .brand-text h1 {
      color: #111827;
      font-size: 1.16rem;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .brand-text p { color: #6B7280; font-size: 0.8rem; margin-top: 3px; font-weight: 500; }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #E5E7EB 20%, #E5E7EB 80%, transparent);
      margin: 0 0 18px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
      letter-spacing: 0.02em;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      color: #111827;
      background: #F9FAFB;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    .form-group input::placeholder { color: #9CA3AF; }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4F46E5;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.13);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 12px 24px -12px rgba(79, 70, 229, 0.9);
      margin-top: 4px;
    }
    .btn:active { transform: scale(0.985); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #4F46E5;
      color: #4F46E5;
      box-shadow: none;
    }

    .msg {
      font-size: 0.83rem;
      line-height: 1.45;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: center;
      display: none;
      overflow-wrap: anywhere;
    }
    .error-msg { color: #B91C1C; background: #FEF2F2; border: 1px solid #FECACA; }
    .success-msg { color: #047857; background: #ECFDF5; border: 1px solid #A7F3D0; }

    .switch-link { text-align: center; margin-top: 18px; font-size: 0.85rem; color: #6B7280; }
    .switch-link a { color: #4F46E5; font-weight: 700; text-decoration: none; cursor: pointer; }

    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; min-width: 0; }
    .pkg-note { font-size: 0.75rem; color: #94A3B8; margin-top: 4px; }

    .foot {
      margin-top: 18px;
      text-align: center;
      font-size: 0.73rem;
      color: #9CA3AF;
      letter-spacing: 0.03em;
    }

    @media (max-width: 380px) {
      .card { padding: 24px 18px 20px; border-radius: 18px; }
      .brand-mark { width: 46px; height: 46px; flex-basis: 46px; font-size: 1.35rem; border-radius: 14px; }
      .brand-text h1 { font-size: 1.05rem; }
      .form-row { flex-direction: column; gap: 0; }
    }
    @media (min-width: 769px) {
      .card { padding: 34px 32px 28px; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-mark">&#x1F3EB;</div>
    <h1>SkyHonix School</h1>
    <p>School Management System</p>
    <div class="spinner"></div>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">&#x1F3EB;</div>
        <div class="brand-text">
          <h1>SkyHonix School Portal</h1>
          <p>Administrator sign in</p>
        </div>
      </div>
      <div class="divider"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">School Email</label>
          <input type="email" id="login-email" placeholder="school@email.com" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn" id="btn-login">Sign In</button>
        <div class="msg error-msg" id="login-error"></div>
      </form>
      <div class="switch-link">
        Don't have an account? <a onclick="showScreen('register-screen')">Register School</a>
      </div>
      <p class="foot">SkyHonix &middot; Secure school workspace</p>
    </div>
  </div>

  <!-- REGISTER -->
  <div id="register-screen" class="screen">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">&#x1F3EB;</div>
        <div class="brand-text">
          <h1>Register Your School</h1>
          <p>Create a new school account</p>
        </div>
      </div>
      <div class="divider"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="reg-school-name">School Name</label>
          <input type="text" id="reg-school-name" placeholder="ABC School" autocomplete="organization" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="school@email.com" autocomplete="email" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="form-group">
            <label for="reg-phone">Phone</label>
            <input type="tel" id="reg-phone" placeholder="03001234567" autocomplete="tel" inputmode="tel" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Create a password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="reg-package">Package</label>
          <select id="reg-package">
            <option value="Package 1">Package 1 - Rs 1,200/mo</option>
            <option value="Package 2">Package 2 - Rs 2,000/mo</option>
            <option value="Package 3" selected>Package 3 - Rs 3,000/mo</option>
            <option value="Package 4">Package 4 - Rs 4,000/mo</option>
            <option value="Package 5">Package 5 - Rs 5,200/mo</option>
            <option value="Package 6">Package 6 - Rs 6,600/mo</option>
            <option value="Package 7">Package 7 - Rs 8,000/mo</option>
          </select>
        </div>
        <button type="submit" class="btn" id="btn-register">Register School</button>
        <div class="msg error-msg" id="reg-error"></div>
        <div class="msg success-msg" id="reg-success"></div>
      </form>
      <div class="switch-link">
        Already registered? <a onclick="showScreen('login-screen')">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    var SERVER = 'https://skyhonixonline.vercel.app';

    function showScreen(id) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('register-screen').style.display = 'none';
      document.getElementById(id).style.display = 'flex';
    }

    var splash = document.getElementById('splash');
    var SESSION_TOKEN_KEY = 'skyhonix_app_token';
    var SESSION_USER_KEY = 'skyhonix_app_user';
    var PORTAL_PATH = '/portal.html';
    var SPLASH_MIN_MS = 450;
    var bootAt = Date.now();
    var loginRevealed = false;

    function enterPortal(token, userStr) {
      // location.replace() — NOT location.href — so the login screen leaves
      // the history stack. Back button on the dashboard then closes the app
      // instead of walking back into the login screen (which looked like a
      // logout).
      window.location.replace(SERVER + PORTAL_PATH + '#token=' + token + '&user=' + userStr);
    }

    function saveSession(token, userStr) {
      try {
        localStorage.setItem(SESSION_TOKEN_KEY, token);
        localStorage.setItem(SESSION_USER_KEY, userStr);
      } catch (e) {}
    }

    function clearSession() {
      try {
        localStorage.removeItem(SESSION_TOKEN_KEY);
        localStorage.removeItem(SESSION_USER_KEY);
      } catch (e) {}
    }

    function revealLogin() {
      if (loginRevealed) return;
      loginRevealed = true;
      var wait = Math.max(0, SPLASH_MIN_MS - (Date.now() - bootAt));
      setTimeout(function() {
        splash.classList.add('hidden');
        setTimeout(function() {
          splash.style.display = 'none';
          showScreen('login-screen');
        }, 250);
      }, wait);
    }

    // A signed-in user never sees the login screen again: the app hands its
    // stored token straight back to the portal, which owns the real session.
    // The server rejects it if the user logged out, so "Log out" sticks.
    function restoreSession() {
      var token = null, userStr = null;
      try {
        token = localStorage.getItem(SESSION_TOKEN_KEY);
        userStr = localStorage.getItem(SESSION_USER_KEY);
      } catch (e) {}

      if (!token || !userStr) {
        revealLogin();
        return;
      }

      var settled = false;
      var settle = function(fn) {
        if (settled) return;
        settled = true;
        fn();
      };

      try {
        fetch(SERVER + '/api/auth/session', {
          headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(res) {
          if (res.status === 401 || res.status === 403) {
            clearSession();
            settle(revealLogin);
          } else {
            settle(function() { enterPortal(token, userStr); });
          }
        }).catch(function() {
          // Offline — keep the session and open the portal from cache.
          settle(function() { enterPortal(token, userStr); });
        });
      } catch (e) {
        settle(revealLogin);
      }

      // Never hang on the splash if the network stalls.
      setTimeout(function() { settle(revealLogin); }, 6000);
    }

    // Warm the portal shell into the HTTP cache while the user types their
    // credentials, so the dashboard opens instantly after Sign In.
    var PREFETCH_ASSETS = [
      '/portal.html',
      '/css/styles.css?v=4',
      '/js/app.js?v=17',
      '/js/section-history.js?v=1',
      '/js/offline-core.js',
      '/manifest.json'
    ];
    function prefetchPortal() {
      if (typeof fetch !== 'function') return;
      PREFETCH_ASSETS.forEach(function (asset) {
        fetch(SERVER + asset, { cache: 'force-cache', credentials: 'omit' }).catch(function () {});
      });
    }
    setTimeout(prefetchPortal, 300);
    document.getElementById('login-email').addEventListener('focus', prefetchPortal, { once: true });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      var btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        var res = await fetch(SERVER + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            schoolEmail: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        var userStr = encodeURIComponent(JSON.stringify(data.user));
        saveSession(data.token, userStr);
        enterPortal(data.token, userStr);
      } catch(err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var errEl = document.getElementById('reg-error');
      var successEl = document.getElementById('reg-success');
      errEl.style.display = 'none';
      successEl.style.display = 'none';
      var btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.textContent = 'Registering...';
      try {
        var res = await fetch(SERVER + '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            schoolName: document.getElementById('reg-school-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value,
            phone: document.getElementById('reg-phone').value,
            selectedPackage: document.getElementById('reg-package').value
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        successEl.textContent = data.message + ' Your School ID will be: ' + data.schoolId;
        successEl.style.display = 'block';
        document.getElementById('register-form').reset();
      } catch(err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register School';
      }
    });

    // Restore an existing session instead of showing the login screen.
    restoreSession();
  </script>
</body>
</html>
