<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyHonix Launcher - Workspace Dashboard</title>
  <style>
    body {
      background: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .launcher-card {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #9ca3af;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .btn {
      display: block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
      color: #f3f4f6;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #ec4899;
    }
  </style>
</head>
<body>
  <div class="launcher-card">
    <h1>SkyHonix Workspace</h1>
    <p>Double-click launcher for the School Management Dashboard.</p>
    
    <a href="http://localhost:3000/portal.html" class="btn" id="local-link">Launch Workspace (Port 3000)</a>
    <a href="public/portal.html" class="btn btn-outline">Open Static Local Workspace</a>
  </div>

  <script>
    // Perform a quick health check to see if local server is active
    fetch('http://localhost:3000/api/auth/session')
      .then(res => {
        // Local server is running, auto redirect in 1 second
        setTimeout(() => {
          window.location.href = "http://localhost:3000/portal.html";
        }, 1200);
      })
      .catch(err => {
        // Local server not active, change link colors
        const btn = document.getElementById('local-link');
        btn.style.background = 'linear-gradient(135deg, #374151 0%, #1f2937 100%)';
        btn.innerText = 'Start server.js to use Local Host';
        btn.style.cursor = 'default';
        btn.addEventListener('click', (e) => e.preventDefault());
      });
  </script>
</body>
</html>
